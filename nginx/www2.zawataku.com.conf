# /etc/nginx/sites-available/default に配置（apply_nginx.sh で反映）
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/www2.zawataku.com/html/index;
    index index.html;

    # Cloudflare Tunnel 経由の訪問者IPを記録
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/www2_access.log;
    error_log  /var/log/nginx/www2_error.log;

    # ドットファイル（.git、作成途中の一時ファイル等）とテンプレートは非公開
    location ~ /\. { deny all; }
    location = /index.template.html { deny all; }

    # 毎分更新されるのでキャッシュさせない
    location = /index.html      { add_header Cache-Control "no-cache"; }
    location = /img/traffic.png { add_header Cache-Control "no-cache"; }

    location / {
        try_files $uri $uri/ =404;
    }
}
